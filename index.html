<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deep Dig</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --ink: #f6ead8; --muted: #b9a68c; --gold: #ffc94a; --panel: #1d1610; --panel2: #2a2017; --line: rgba(255,214,150,.14); --good: #7fe08a; --bad: #ff7a6a; --disp: "Bungee", sans-serif; }

  #app { position: fixed; inset: 0; display: grid; grid-template-columns: minmax(0, 1fr) 360px; }

  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  canvas { display: block; }

  /* top bar over the dig view */

  @media (max-width: 1240px) { #hud { gap: 6px; padding: 10px; } .chip { padding: 6px 10px; border-radius: 12px; } .chip b { font-size: 17px; } .chip small { letter-spacing: .1em; } .chip i { font-size: 11px; } }

  .boxRow .bc { color: var(--muted); } .boxRow .bv { color: var(--gold); min-width: 64px; text-align: right; }

  #layerName { margin-left: auto; text-align: right; }

  #map:hover { border-color: rgba(255,214,150,.45); }

  .mrow.locked { opacity: .45; }
  .mh { display: flex; justify-content: space-between; font-weight: 900; } .mh span { color: var(--muted); font-size: 12px; }
  .md { display: flex; flex-wrap: wrap; gap: 6px 10px; margin-top: 5px; font-size: 12px; font-weight: 800; color: var(--muted); }
  .mo i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  .pxI { width: 32px; height: 32px; image-rendering: pixelated; } .pxI.sil { filter: brightness(0) opacity(.4); } .uiI, .hI { width: 28px; height: 28px; image-rendering: pixelated; vertical-align: -5px; } .bI { width: 22px; height: 22px; image-rendering: pixelated; } .cI { width: 14px; height: 14px; image-rendering: pixelated; vertical-align: -3px; margin-right: 4px; }

  .bkI:hover { background: rgba(255,255,255,.06); } .bkI.on { background: rgba(255,201,74,.16); }
  .bkI img { width: 24px; height: 24px; image-rendering: pixelated; } .bkI .gem { width: 18px; height: 18px; display: inline-block; background: var(--c); clip-path: polygon(50% 0, 100% 38%, 82% 100%, 18% 100%, 0 38%); }
  img.sil { filter: brightness(0) opacity(.45); }

  .bkHT small { font-size: 11px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; color: #8a5a28; } .bkHT h3 { text-align: left; margin: 2px 0 8px !important; } .bkHT .bkTags { justify-content: flex-start; }

  .bkS { padding: 8px 10px; border-radius: 10px; background: rgba(90,52,18,.1); text-align: left; } .bkS small { display: block; font-size: 10px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; color: #8a5a28; } .bkS b { font-size: 14px; color: #3a2614; }

  .bkNav { margin-top: auto; display: flex; justify-content: space-between; gap: 8px; } .bkNav button { padding: 7px 12px; border-radius: 10px; border: 1px solid rgba(90,52,18,.3); background: rgba(90,52,18,.08); color: #5a3412; font-weight: 900; }

  .bkBig.sil { filter: brightness(0) opacity(.35); } span.bkBig.gem { clip-path: polygon(50% 0, 100% 38%, 82% 100%, 18% 100%, 0 38%); background: var(--c); }
  .bkTags { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; } .bkTags span { font-size: 11px; font-weight: 900; padding: 3px 8px; border-radius: 999px; background: rgba(90,52,18,.14); color: #5a3412; }
  @media (max-width: 640px) { .book { grid-template-columns: 1fr; height: auto; } .bkIdx { max-height: 30vh; border-right: 0; } } .mr { margin-left: auto; color: var(--gold); }
  .embedded #side { padding-top: 58px; }

  /* ability buttons along the bottom of the view */
  #abilities { position: absolute; left: 50%; bottom: 16px; translate: -50% 0; display: flex; gap: 10px; }
  .ab { position: relative; width: 66px; height: 66px; border-radius: 16px; border: 2px solid rgba(255,214,150,.3); background: rgba(24,17,11,.88); display: grid; place-items: center; overflow: hidden; padding: 0; }
  .ab .ic { font-size: 28px; line-height: 1; filter: drop-shadow(0 2px 2px rgba(0,0,0,.5)); }
  .ab .cd { position: absolute; inset: 0; background: rgba(0,0,0,.62); transform-origin: bottom; }
  .ab .lbl { position: absolute; bottom: 3px; left: 0; right: 0; font-size: 9px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .ab .key { position: absolute; top: 3px; left: 5px; font-size: 10px; font-weight: 900; color: var(--muted); }
  .ab.ready { border-color: var(--gold); box-shadow: 0 0 18px rgba(255,201,74,.35); }
  .ab.active { border-color: #7fe9ff; box-shadow: 0 0 22px rgba(127,233,255,.5); }
  .ab.locked { opacity: .35; }
  .ab.locked .ic { filter: grayscale(1); }

  /* side panel */
  #side { display: flex; flex-direction: column; background: linear-gradient(180deg, #21180f, #150f0a); border-left: 1px solid var(--line); min-height: 0; }
  #brand { padding: 16px 18px 10px; display: flex; align-items: baseline; gap: 10px; }
  .bIcons { margin-left: auto; display: flex; gap: 6px; align-self: center; }
  .bIcons button { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: rgba(255,255,255,.05); font-weight: 900; font-size: 15px; color: var(--gold); display: grid; place-items: center; padding: 0; }
  .bIcons button:hover { border-color: rgba(255,214,150,.5); background: rgba(255,201,74,.1); }
  #brand h1 { margin: 0; font: 26px var(--disp); color: var(--gold); letter-spacing: .02em; text-shadow: 0 3px 0 #6a3e10; }
  #brand span { font-size: 12px; color: var(--muted); font-weight: 800; }
  #rates { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 16px 10px; }
  #rates div { background: rgba(255,255,255,.04); border-radius: 10px; padding: 6px 10px; }
  #rates small { display: block; font-size: 10px; font-weight: 900; letter-spacing: .14em; color: var(--muted); }
  #rates b { font-weight: 900; font-size: 15px; }
  #tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; padding: 4px 12px 10px; border-bottom: 1px solid var(--line); }
  #tabs button.helpTab { flex: 0 0 26px; font-size: 14px; color: var(--gold); }
  .abCard { background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin: 10px 0; }
  .abCard.locked { opacity: .5; }
  .abHead { display: flex; gap: 10px; align-items: center; } .abHead .abIc { font-size: 26px; width: 40px; height: 40px; display: grid; place-items: center; background: rgba(0,0,0,.25); border-radius: 10px; }
  .abHead b { display: block; font-size: 15px; } .abHead small { color: var(--muted); font-weight: 800; font-size: 11px; } .abSt { margin-left: auto; font-size: 11px; font-weight: 900; color: var(--muted); text-align: right; }
  .abCard p { margin: 8px 0 0; font-size: 13px; line-height: 1.45; color: var(--muted); font-weight: 700; } .abCard p b { color: var(--ink); } .abCard .abNow { color: #ffe0a8; } .abCard .bigBtn { margin-top: 10px; padding: 9px; font-size: 14px; }
  .card.wide { width: min(620px, 94vw); }
  .card.helpCard { width: min(920px, 94vw); } .helpCard .help { columns: 2 300px; column-gap: 30px; max-height: 70vh; -webkit-mask-image: linear-gradient(180deg, #000 88%, transparent); mask-image: linear-gradient(180deg, #000 88%, transparent); padding-bottom: 18px; }
  .helpCard .help h4 { break-after: avoid; } .helpCard .help p { break-inside: avoid; } .helpCard .help h4:first-child { margin-top: 0; } .help { text-align: left; max-height: 62vh; overflow-y: auto; padding-right: 4px; } .help h4 { margin: 14px 0 4px; color: var(--gold); font-size: 14px; letter-spacing: .04em; } .help p { margin: 0; font-size: 13.5px; } .help b { color: var(--ink); }
  #tabs button { padding: 8px 4px; background: rgba(255,255,255,.04); border: 1px solid transparent; border-radius: 10px; font-weight: 900; font-size: 11px; letter-spacing: .06em; color: var(--muted); text-transform: uppercase; white-space: nowrap; }
  #tabs button:hover { color: var(--ink); background: rgba(255,255,255,.07); }
  #tabs button.on { color: #2a1a06; background: var(--gold); }
  #tabs button .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); margin-left: 4px; vertical-align: 2px; }
  #list { flex: 1; overflow-y: auto; padding: 10px 12px 16px; display: flex; flex-direction: column; gap: 8px; }
  #list::-webkit-scrollbar { width: 8px; } #list::-webkit-scrollbar-thumb { background: rgba(255,214,150,.18); border-radius: 4px; }
  .row { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 10px; text-align: left; background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; transition: transform .08s, border-color .15s; }
  .row:hover { border-color: rgba(255,214,150,.4); }
  .row:active { transform: scale(.985); }
  .row.cant { opacity: .5; }
  .row.cant:hover { border-color: var(--line); }
  .row.hidden { filter: blur(.6px) grayscale(1); opacity: .35; }
  .row .ic { width: 46px; height: 46px; border-radius: 10px; background: rgba(0,0,0,.25); display: grid; place-items: center; font-size: 26px; }
  .row .ic .pxi { width: 40px; height: 40px; image-rendering: pixelated; object-fit: contain; }
  .row .t b { display: block; font-weight: 900; font-size: 15px; }
  .row .t small { display: block; color: var(--muted); font-size: 12px; font-weight: 700; line-height: 1.3; }
  .row .t em { font-style: normal; color: var(--good); }
  .row .p { text-align: right; }
  .row .p b { display: block; color: var(--gold); font-weight: 900; font-size: 14px; }
  .row .p small { color: var(--muted); font-weight: 800; font-size: 12px; }
  .row.owned { border-color: rgba(127,224,138,.35); }
  .row.owned .p b { color: var(--good); }
  #buyAmt { display: flex; gap: 4px; padding: 8px 12px 0; }
  #buyAmt button { flex: 1; padding: 5px; border-radius: 8px; border: 1px solid var(--line); background: none; font-weight: 900; font-size: 12px; color: var(--muted); }
  #buyAmt button.on { background: var(--gold); color: #2a1a06; border-color: var(--gold); }
  .museum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .relic { padding: 10px 6px 8px; border-radius: 12px; background: var(--panel2); border: 1px solid var(--line); text-align: center; }
  .relic .ic { font-size: 30px; height: 36px; }
  .relic b { display: block; font-size: 11px; font-weight: 900; margin-top: 4px; }
  .relic small { display: block; font-size: 10px; color: var(--good); font-weight: 800; }
  .relic.no { opacity: .45; } .relic.no .ic { filter: brightness(0) invert(.25); }
  .layerHead { font: 13px var(--disp); color: var(--muted); margin: 6px 2px 0; letter-spacing: .04em; }
  .note { color: var(--muted); font-size: 13px; line-height: 1.45; font-weight: 700; padding: 2px 4px; }
  .big { padding: 14px; border-radius: 14px; background: linear-gradient(135deg, #3a2410, #24170d); border: 1px solid rgba(255,201,74,.35); }
  .big h3 { margin: 0 0 6px; font: 18px var(--disp); color: var(--gold); }
  .bigBtn { width: 100%; margin-top: 10px; padding: 12px; border-radius: 12px; border: 0; background: var(--gold); color: #2a1a06; font-weight: 900; font-size: 15px; }
  .bigBtn:disabled { opacity: .4; cursor: default; }

  /* popups */
  #toasts { position: absolute; right: 14px; top: 84px; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; }
  .toast { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-radius: 14px; background: rgba(24,17,11,.92); border: 1px solid rgba(255,201,74,.45); box-shadow: 0 10px 30px rgba(0,0,0,.4); animation: tin .35s cubic-bezier(.2,1.4,.4,1); max-width: 300px; }
  .toast .ic { font-size: 30px; }
  .toast b { display: block; font-weight: 900; } .toast small { color: var(--muted); font-weight: 700; } .toast em { font-style: normal; color: var(--good); font-weight: 800; }
  @keyframes tin { from { transform: translateX(40px) scale(.8); opacity: 0; } }
  .modal { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(8,5,3,.72); backdrop-filter: blur(4px); }
  .modal[hidden] { display: none; }
  .card { width: min(440px, 92vw); padding: 24px; border-radius: 20px; background: linear-gradient(160deg, #2c1e12, #1a120b); border: 1px solid rgba(255,201,74,.35); text-align: center; box-shadow: 0 30px 80px rgba(0,0,0,.6); }

  .card p { color: var(--muted); font-weight: 700; line-height: 1.5; margin: 6px 0; }
  .card .num { font: 30px var(--disp); color: #fff; margin: 10px 0; }

  .card .row2 button { flex: 1; padding: 11px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.05); font-weight: 900; }

  .card label { display: flex; align-items: center; gap: 10px; justify-content: space-between; font-weight: 800; margin: 10px 0; }
  .card input[type=range] { flex: 1; accent-color: var(--gold); }

  @media (max-width: 820px) {
    #app { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) 46%; }
    #side { border-left: 0; border-top: 1px solid var(--line); }
    #brand h1, #brand #mineName { display: none; } #brand { padding: 8px 12px 0; }
    .chip b { font-size: 17px; }
    #layerName { display: none; }
    .ab { width: 54px; height: 54px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="view">
    <canvas id="cv"></canvas>
    <div id="hud">
      <div class="chip" id="cash"><small><span data-ui="money" data-fb="" data-cls="cI"></span>Money</small><b>$0</b> <i id="cashRate"></i></div>
      <div class="chip" id="depth"><small>Depth</small><b>0 m</b> <i id="depthRate"></i></div>
      <div class="chip" id="liftChip" hidden onclick="openBox()" style="cursor:pointer" title="Open the ore box"><small>🛗 Ore lift</small><b>$0</b> <i></i><div class="bar"><div></div></div></div>
      <div class="chip" id="layerName"><small>Layer</small><b>Topsoil</b></div>
      <button id="menuBtn" title="Menu">☰</button>
    </div>
    <div id="toasts"></div>
    <canvas id="map" title="Mine map"></canvas>
    <div id="meter"><div class="mf"></div><span></span></div>
    <div id="abilities"></div>
  </div>
  <aside id="side">
    <div id="brand"><h1>DEEP DIG</h1><span id="mineName">Mine #1 · Earth</span><div class="bIcons"><button id="bookBtn" title="Field Guide: every ore and gem" data-ui="book" data-fb="📖" data-cls="bI">📖</button><button id="helpBtn" title="How to play">?</button></div></div>
    <div id="rates"><div><small>Pick (per click)</small><b id="rClick">1</b></div><div><small>Crew (dig/s)</small><b id="rDps">0</b></div></div>
    <div id="tabs"></div>
    <div id="buyAmt"></div>
    <div id="list"></div>
  </aside>
</div>
<div class="modal" id="modal" hidden><div class="card" id="modalCard"></div></div>
<script>
"use strict";
const $ = id => document.getElementById(id);
const EMBEDDED = window.parent !== window;
if (EMBEDDED) document.body.classList.add("embedded");
const rand = (a, b) => a + Math.random() * (b - a), clamp = (v, a, b) => v < a ? a : v > b ? b : v, pick = a => a[(Math.random() * a.length) | 0];
// deterministic noise for the rock walls

        <div class="bkTags"><span>${e.plain ? "Everywhere" : e.rare ? "Rare" : "Common"}</span>${seen && S.ore[e.name] ? `<span>×${fmt(S.ore[e.name], 0)} this mine</span>` : ""}</div></div></div>
    <div class="bkStats">${stat("Found in", e.layer.name)}${stat("Depth", `${fmtM(e.layer.from)} – ${to}`)}${stat("Per metre", e.plain ? "plain rock" : `${Math.round(chance * 100)}% chance`)}${stat("Sells for", e.plain ? "—" : e.rare ? "×6 a metre" : "×3 a metre")}</div>

    <div class="bkNav"><button onclick="bookSel=${JSON.stringify(prev).replace(/"/g, "&quot;")};openBook()">‹ ${bookSeen(prev) ? prev : "???"}</button><button onclick="bookSel=${JSON.stringify(next).replace(/"/g, "&quot;")};openBook()">${bookSeen(next) ? next : "???"} ›</button></div>

}
function openBook(sel) {

    const seen = bookSeen(e.name), ic = ORE[e.name] ? `<img src="${ORE[e.name].url}" class="${seen ? "" : "sil"}">` : `<span class="gem" style="--c:${seen ? e.col : "#000"}"></span>`;

    if (a < list.scrollTop) list.scrollTop = a - 8; else if (b > list.scrollTop + list.clientHeight) list.scrollTop = b - list.clientHeight + 8; }
}

// shop icons for the crew, cut from their sprites (until they load, the emoji stands in)
const CREW_ICON = {};
function makeCrewIcons() {
  const src = { miner: [() => MINER_SHEET, 0, 0, 68, 68], jack: [() => JACK_SHEET, 0, 0, 68, 68], drill: [() => DRILL_SHEET, 0, 0, 48, 48], exc: [() => EXC_SHEET, 0, 0, 108, 64], tbm: [() => TBM_SHEET, 0, 0, 64, 64], laser: [() => LANCE_SHEET, 0, 0, 48, 48], grav: [() => GRAV_SHEET, 0, 0, 64, 64], quake: [() => QUAKE_SHEET, 0, 0, 64, 64] };
  for (const [id, [im, x, y, w, h]] of Object.entries(src)) { const I = im(); if (CREW_ICON[id] || !I || !ready(I)) continue;
    const c = document.createElement("canvas"); c.width = w; c.height = h; const q = c.getContext("2d"); q.drawImage(I, x, y, w, h, 0, 0, w, h);
    const d = q.getImageData(0, 0, w, h).data; let x0 = w, y0 = h, x1 = 0, y1 = 0; for (let yy = 0; yy < h; yy++) for (let xx = 0; xx < w; xx++) if (d[(yy * w + xx) * 4 + 3] > 20) { x0 = Math.min(x0, xx); y0 = Math.min(y0, yy); x1 = Math.max(x1, xx); y1 = Math.max(y1, yy); }
    if (x1 < x0) continue; const sz = Math.max(x1 - x0, y1 - y0) + 2, o = document.createElement("canvas"); o.width = o.height = sz; o.getContext("2d").drawImage(c, x0, y0, x1 - x0 + 1, y1 - y0 + 1, Math.floor((sz - (x1 - x0 + 1)) / 2), Math.floor((sz - (y1 - y0 + 1)) / 2), x1 - x0 + 1, y1 - y0 + 1);
    CREW_ICON[id] = `<img class="pxi" src="${o.toDataURL()}">`; }
}

const KEY = "deepdig_v1";
function save() { S.liftCargo = LIFT.cargo; S.lastSave = Date.now(); S.cdLeft = {}; for (const k in S.cds) S.cdLeft[k] = Math.max(0, S.cds[k] - now()); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} }
function load() {
  let raw = null; try { raw = JSON.parse(localStorage.getItem(KEY) || "null"); } catch {}
  if (!raw || raw.v !== 1) return;
  S = Object.assign(fresh(), raw);
  S.box = S.box || {};   // the box keeps its ore; a load that was mid-climb goes back in the box, and older saves' loose loads become plain ore
  for (const [k, it] of Object.entries(S.liftCargo || {})) { const b = S.box[k] || (S.box[k] = { n: 0, v: 0, c: it.c }); b.n += it.n; b.v += it.v; }
  if (S.liftLoad || S.liftCarry) boxAdd("Ore", "#c9a070", (S.liftLoad || 0) + (S.liftCarry || 0));
  S.liftCargo = null; S.liftLoad = 0; S.liftCarry = 0;
  // cooldowns and buffs were stored on the old clock: carry the remaining time across
  const awayS = (Date.now() - raw.lastSave) / 1000; S.cds = {}; for (const k in (raw.cdLeft || {})) S.cds[k] = now() + Math.max(0, raw.cdLeft[k] - awayS); S.act = {};   // the page clock restarts on reload: keep what was left of each cooldown
  const away = Math.min(8 * 3600, (Date.now() - raw.lastSave) / 1000);
  if (away > 60 && dps() > 0) {
    const c0 = S.cash, d0 = S.depth; let budget = dps(false) * .5 * away, n = 0;   // offline: the crew works at half pace
    while (budget > 0 && n < 200000) { const hm = hazardMul(), need = S.hp / hm; if (budget >= need) { budget -= need; S.hp = 0; const L = layerAt(S.depth); S.cash += BLOCK_VALUE(S.depth) * valueMul(); S.depth++; S.maxDepth = Math.max(S.maxDepth, S.depth); S.best = Math.max(S.best, S.depth); S.hp = BLOCK_HP(S.depth); n++; } else { S.hp -= budget * hm; budget = 0; } }
    S.totalEarned += S.cash - c0;
    setTimeout(() => modal(`<h2>While you were away</h2><p>${fmtTime(away)} passed. Your crew kept digging at half pace.</p><div class="num">+$${fmt(S.cash - c0)}</div><p>+${fmt(S.depth - d0, 0)} m · now at ${fmtM(S.depth)}</p><div class="row2"><button class="main" onclick="closeModal()">Nice</button></div>`), 300);
  }
}

  function noise(d, v, type, f0, f1, q = 1, dl = 0) { const t = ctx.currentTime + dl, s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), gn = ctx.createGain(); s.buffer = nb; s.loop = true; f.type = type; f.Q.value = q; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + d); env(gn, t, v, .002, d); s.connect(f); f.connect(gn); gn.connect(out); s.start(t, Math.random() * .5); s.stop(t + d + .05); }
  const P = 1;
  const S = {
    tick: () => { if (bank.metalL_0) { pickHit(W / 2, 1, rand(.95, 1.08), out); return; } const p = rand(.9, 1.15); noise(.06, .35, "bandpass", 1800 * p, 900, 2.5); tone("triangle", 380 * p, 160, .06, .18); },
    break: () => { if (bank.crunch_0) smp("crunch_0", .3, rand(.95, 1.1), W / 2, 2600, 0, out); noise(.18, .45, "lowpass", 1400, 200, .8); tone("sine", 140, 60, .16, .4); for (let i = 0; i < 3; i++) noise(.05, .15, "bandpass", rand(900, 2200), 600, 3, .03 + i * .04); },
    crit: () => { if (bank.metalL_0) pickHit(W / 2, 1.2, 1.2, out); noise(.1, .5, "bandpass", 2600, 1200, 2); tone("triangle", 880, 1320, .12, .2); tone("triangle", 1320, 1760, .2, .14, .06); },
    deliver: () => { tone("triangle", 988, 988, .08, .12); tone("triangle", 1319, 1319, .14, .12, .06); noise(.12, .08, "highpass", 6000, 8000, .7, .02); },
    buy: () => { tone("triangle", 1320, 1320, .07, .16); tone("triangle", 1980, 1980, .14, .14, .05); },
    no: () => tone("square", 160, 120, .09, .08),
    ui: () => tone("triangle", 900, 900, .04, .08),
    find: () => { [784, 988, 1175, 1568].forEach((f, i) => tone("triangle", f, f, .35, .14, i * .07)); },
    layer: () => { tone("sine", 220, 220, .6, .2); tone("sine", 330, 330, .6, .14, .1); },
    glint: () => { tone("sine", 2400, 3200, .15, .08); tone("sine", 3200, 4000, .2, .06, .08); },
    vein: () => { for (let i = 0; i < 6; i++) tone("triangle", 1200 + i * 220, 1400 + i * 220, .1, .1, i * .035); noise(.3, .12, "highpass", 5000, 7000, .7); },
    boom: () => { tone("sine", 90, 30, .9, .8); noise(.8, .7, "lowpass", 1200, 80, .8); for (let i = 0; i < 6; i++) noise(.08, .2, "bandpass", rand(600, 1600), 400, 3, .1 + i * .09); },
    power: () => { tone("sawtooth", 200, 800, .4, .08); tone("sine", 600, 1200, .4, .12); },
    quake: () => { tone("sine", 58, 26, 1.6, .55); tone("sine", 90, 40, .5, .3); noise(1.5, .45, "lowpass", 420, 60, .7); for (let i = 0; i < 8; i++) noise(.09, .18, "bandpass", rand(500, 1300), 300, 3, .05 + i * .13); },
    seal: () => { [523, 659, 784, 1047, 1319].forEach((f, i) => tone("triangle", f, f, .5, .12, i * .09)); tone("sine", 65, 65, 1.2, .3); },
  };
  // the mine at night: a low hum and the odd water drip
  function ambience() {
    const o = ctx.createOscillator(), gn = ctx.createGain(), f = ctx.createBiquadFilter(); o.type = "sawtooth"; o.frequency.value = 48; f.type = "lowpass"; f.frequency.value = 140; gn.gain.value = .025; o.connect(f); f.connect(gn); gn.connect(out); o.start(); persist.push(o);
    const drip = () => { if (ctx.state === "running" && vol > 0) { const t = ctx.currentTime, os = ctx.createOscillator(), g2 = ctx.createGain(); os.type = "sine"; const f0 = rand(900, 1800); os.frequency.setValueAtTime(f0, t); os.frequency.exponentialRampToValueAtTime(f0 * 1.9, t + .06); env(g2, t, .05, .002, .12); os.connect(g2); g2.connect(out); os.start(t); os.stop(t + .15); } setTimeout(drip, rand(2500, 7000)); };
    setTimeout(drip, 3000);
  }
  function shutdown() { try { master && master.disconnect(); } catch {} for (const n of persist) try { n.stop(); } catch {} persist.length = 0; }
  addEventListener("pagehide", shutdown); addEventListener("unload", shutdown);
  return { init, at, crew, lance, grav, setMusic, get music() { return mVol; }, _ctx: () => ctx, _out: () => out, _mbus: () => mBus, _bus: () => crewBus, get dbg() { return { state: ctx && ctx.state, bank: Object.keys(bank), loops: Object.keys(loops), bus: crewBus && crewBus.gain.value }; }, get vol() { return vol; }, setVol(v) { vol = v; if (out) out.gain.value = vol * .5; try { localStorage.setItem("deepdig_vol", v); } catch {} },
    play(n) { if (!ctx || ctx.state !== "running" || !S[n] || vol <= 0) return; try { S[n](); } catch {} } };
})();
// start the sound right away: inside KokoR the click that opened the game already allows it. Standalone, the browser may hold it
// until the first click or key press, so keep trying on those too.
Sfx.init();
for (const ev of ["pointerdown", "keydown", "touchstart"]) addEventListener(ev, () => Sfx.init(), { passive: true });

// ================= KokoR embedding =================
addEventListener("message", e => { const m = e.data || {}; if (m.kokor === "volume" && typeof m.sfx === "number") Sfx.setVol(m.sfx > 1 ? m.sfx / 100 : m.sfx); if (m.kokor === "volume" && typeof m.music === "number") Sfx.setMusic(m.music > 1 ? m.music / 100 : m.music); if (m.kokor === "dig-pause") save(); });
addEventListener("visibilitychange", () => { if (document.hidden) save(); });
addEventListener("beforeunload", save);

// ================= start =================
$("bookBtn").onclick = () => openBook(); $("helpBtn").onclick = openHelp;
loadTiles(() => chunkCache.clear()); resize(); load(); camY = S.depth * PX - H * .64 - 200; renderTabs(); renderSide(true); renderTop(); renderAbilities(); helpOnFirstPlay();
if (!S.clicks && !S.depth) setTimeout(() => toast("⛏️", "Click the rock to dig", "Earn money from every metre. Hire a crew to dig for you."), 600);
requestAnimationFrame(frame);

// ================= DEV PANEL (F9 toggles, F8 toggles the auto clicker) =================
const Dev = (() => {
  const KEYD = "deepdig_dev";
  let cfg = { cps: 20, mute: true, veins: false, abil: false, buy: false, nocd: false };

  const keep = () => { try { localStorage.setItem(KEYD, JSON.stringify(cfg)); } catch {} };
  const D = { warp: 1, auto: false, inAuto: false };
  let el = null, acc = 0, buyT = 0, hist = [], clicksDone = 0, cpsSeen = 0, wipeArm = 0, lastS = 0;

  // auto clicks share one gated sound so 100 clicks a second doesn't turn into noise
  const play0 = Sfx.play;
  Sfx.play = n => { if (D.inAuto) { if (cfg.mute) return; if (T - lastS < .07) return; lastS = T; } play0(n); };

  function autoClick(n) {
    D.inAuto = true;

  }
  function autoBuy() {
    for (let guard = 0; guard < 60; guard++) {
      const opts = [];
      CREW.forEach((c, i) => { if (i === 0 || crewN(CREW[i - 1].id) > 0) opts.push([crewCost(c), () => { S.crew[c.id] = crewN(c.id) + 1; }]); });
      for (const u of UPS) { const max = u.lv ? (u.max || Infinity) : 1; if (S.maxDepth >= (u.unlock || 0) && upN(u.id) < max) opts.push([upCost(u), () => { S.ups[u.id] = upN(u.id) + 1; }]); }
      opts.sort((a, b) => a[0] - b[0]);
      if (!opts.length || opts[0][0] > S.cash) break;
      S.cash -= opts[0][0]; opts[0][1]();
    }
    renderSide(true);
  }
  D.step = dt => {
    if (D.auto) { acc += cfg.cps * dt; const n = Math.floor(acc); if (n > 0) { acc -= n; autoClick(n); } }

    if (cfg.nocd) S.cds = {};
    if (cfg.abil) for (const a of ABILITIES) { const st = abilityState(a); if (st.unlocked && !st.cdLeft && !st.on) useAbility(a.id); }
    if (cfg.buy && (buyT -= dt) <= 0) { buyT = .5; autoBuy(); }
    if (el && !el.hidden) { hist.push([performance.now(), S.totalEarned, clicksDone]); while (hist.length > 2 && performance.now() - hist[0][0] > 3000) hist.shift(); }
  };

  // skip ahead in game time, in one-second steps so the crew, abilities and auto-buy all keep up
  function skip(secs) {
    const was = visible; visible = false;
    for (let t = 0; t < secs; t++) { clockOffset += 1; D.step(1); tick(1); }
    visible = was; camY = (S.depth * PX) - H * .45; renderSide(true); renderTop(); renderAbilities();
    toast("⏩", `Skipped ${fmtTime(secs)}`, `Now at <em>${fmtM(S.depth)}</em>`);
  }
  function teleport(d) {
    d = Math.max(0, Math.floor(d)); const L0 = layerAt(S.depth);
    S.depth = d; S.maxDepth = Math.max(S.maxDepth, d); S.best = Math.max(S.best, d); S.hp = BLOCK_HP(d);
    camY = d * PX - H * .45; if (layerAt(d) !== L0) enterLayer(layerAt(d)); renderSide(true); renderTop(); renderAbilities();
  }
  function digDown(m) { const target = S.depth + m; SRC = "dev"; let g = 0; while (S.depth < target && g++ < 1000) dig(S.hp + .0001); SRC = "crew"; renderSide(true); }

  const css = `
  #dev { position: fixed; top: 12px; left: 12px; z-index: 9999; width: 330px; max-height: calc(100vh - 24px); overflow-y: auto;
    background: rgba(10,7,20,.97); border: 1px solid #ff5aa0; color: #e6dcff; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace;
    box-shadow: 0 10px 40px rgba(0,0,0,.6); padding: 10px 12px 14px; cursor: default; }
  .embedded #dev { top: 64px; }
  #dev h3 { margin: 0 0 6px; font-size: 13px; color: #ff5aa0; display: flex; justify-content: space-between; align-items: center; }
  #dev h4 { margin: 12px 0 5px; font-size: 11px; letter-spacing: .12em; color: #9fe8ff; border-bottom: 1px solid #2a2048; padding-bottom: 3px; }
  #dev .dr { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; align-items: center; }
  #dev button { font: inherit; padding: 3px 7px; background: #1e1638; color: #e6dcff; border: 1px solid #3a2a6a; cursor: pointer; border-radius: 0; }
  #dev button:hover { border-color: #ff5aa0; }
  #dev button.on { background: #ff5aa0; color: #1a0a14; border-color: #ff5aa0; }
  #dev label { display: flex; gap: 5px; align-items: center; cursor: pointer; margin-right: 8px; }
  #dev input[type=number], #dev select { font: inherit; background: #120c24; color: #e6dcff; border: 1px solid #3a2a6a; padding: 3px 5px; width: 90px; }

      <div class="dr"><label><input type="checkbox" data-c="mute"> Mute auto clicks</label></div>

      <h4>AUTOMATE</h4>

      <h4>TIME</h4>

      <div class="note" id="dv-live"></div>`;
    document.body.appendChild(el);
    const badge = document.createElement("div"); badge.id = "devBadge"; badge.hidden = true; document.body.appendChild(badge);
    $("dv-layer").innerHTML = LAYERS.map(L => `<option value="${L.from}">${L.name} · ${fmt(L.from, 0)} m</option>`).join("");

      const b = e.target.closest("button"); if (!b) return; Sfx.init(); const ds = b.dataset;
      if (ds.cps) { cfg.cps = +ds.cps; $("dv-cps").value = cfg.cps; keep(); }
      if (ds.warp) D.warp = +ds.warp;
      if (ds.skip) skip(+ds.skip);
      if (ds.cash) { S.cash += +ds.cash; }
      if (ds.mul) { S.cash = +ds.mul ? S.cash * +ds.mul : 0; }

      if (a === "layer") teleport(+$("dv-layer").value);
      if (a === "depth") teleport(+$("dv-depth").value || 0);
      if (a === "crew10") for (const c of CREW) S.crew[c.id] = crewN(c.id) + 10;
      if (a === "ups") for (const u of UPS) { const max = u.lv ? (u.max || Infinity) : 1; if (upN(u.id) < max) S.ups[u.id] = upN(u.id) + 1; }
      if (a === "pick10") S.ups.pick = upN("pick") + 10;

      if (a === "unlock") { S.maxDepth = Math.max(S.maxDepth, 1000); S.best = Math.max(S.best, 1000); }

      if (a === "copy") { save(); try { navigator.clipboard.writeText(localStorage.getItem(KEY)); toast("📋", "Save copied", "JSON is on your clipboard"); } catch { console.log(localStorage.getItem(KEY)); } }

    $("dv-live").innerHTML = `depth <span class="st">${fmtM(S.depth)}</span> (${layerAt(S.depth).name}) · block hp ${fmt(S.hp)}<br>
      money/s <span class="st">$${fmt(rate)}</span> · clicks/s ${fmt(cps, 0)}<br>
      click <span class="st">${fmt(clickPower())}</span> · crew <span class="st">${fmt(dps(true))}/s</span> · crit ${Math.round(critChance() * 100)}%<br>
      value ×${fmt(valueMul())} · hazard ×${hazardMul()} · shards ${S.shards}<br>
      relics ${Object.keys(S.relics).length}/${RELICS.length} · clicks total ${fmt(S.clicks, 0)}<br>
      <span style="color:#6a6088">earned this session: ${src || "—"}</span>`;
  }
  setInterval(live, 250);
  function toggle(on) { if (!el) build(); el.hidden = on === undefined ? !el.hidden : !on; refresh(); live(); }
  addEventListener("keydown", e => {

  });
  Object.assign(D, { toggle, setAuto, skip, teleport, cfg });
  return D;
})();
